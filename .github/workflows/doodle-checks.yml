name: Doodle checks
on:
  pull_request:
    branches: [main]
    paths: ["doodle/**", ".github/workflows/doodle-checks.yml"]
  push:
    branches: [main]
    paths: ["doodle/**", ".github/workflows/doodle-checks.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: doodle
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: doodle/.nvmrc
          cache: npm
          cache-dependency-path: |
            doodle/package-lock.json
            doodle/mobile/package-lock.json
      - name: Install isolated Redis test tools
        run: sudo apt-get update && sudo apt-get install -y redis-server redis-tools
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --silent
      - run: npm run typecheck
      - run: npm run build
      - run: npm ci --no-audit --no-fund
        working-directory: doodle/mobile
      - run: npm test
        working-directory: doodle/mobile
      - run: npm run typecheck
        working-directory: doodle/mobile
