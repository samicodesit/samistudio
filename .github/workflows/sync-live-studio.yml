name: Synchronize verified studio snapshot
on:
  push:
    branches: [chore/sync-live-studio-20260916]
    paths: [.github/workflows/sync-live-studio.yml]
permissions:
  contents: write
jobs:
  synchronize:
    if: github.repository == 'samicodesit/samistudio' && github.ref == 'refs/heads/chore/sync-live-studio-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: chore/sync-live-studio-20260916
      - name: Confirm regression test detects the old homepage
        shell: bash
        run: |
          set +e
          node --test --test-name-pattern='homepage and manifest' tests/studio.test.mjs > "$RUNNER_TEMP/studio-red-test.log" 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -q ERR_ASSERTION "$RUNNER_TEMP/studio-red-test.log"
          tail -15 "$RUNNER_TEMP/studio-red-test.log"
          echo 'Confirmed: the old homepage fails the current-design regression test.'
      - name: Download the audited snapshot and prepare static deployment
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, pathlib, time, urllib.request
          files = {
            'index.html': (6090, '3d9852cd6a8fc7b637653092481e2635aa98821a0cf1ca02a3a8ef1217efe37b'),
            'favicon.svg': (405, '2c8b4f12ab5fd5eba362ef6c788f8bf7c8ac7bf0b988e78c8263bfe9db347f01'),
            'assets/studio.css': (12502, 'f640638ccb16c2ae5acfe305e67666cfcbc1c04cb3aec3290c2723f8e1416e17'),
            'assets/studio.js': (18798, '7896d0e61d4f374819b06bcbe329bb0e275b7250c1123f1387892e3815a70ade'),
            'assets/key-spring.mjs': (904, 'ad680164fc2b83064b9b7f32dc1cfe442cfa8c56cc9f8ebe838a84c63c19e8de'),
            'assets/terminal-housing.webp': (89052, '16716c4519b5f9647fc13f1611fb4268ffbe7bee1244b0149a90378bad6a73de'),
            'assets/terminal-housing-mobile.webp': (24176, '851a3981102479ee6c039d847153d22cadbb19b458faca4bd7d793f3a88d4949'),
            'assets/terminal-keycaps.webp': (86750, 'c6103925a809bba55ee5722511a53cb7a08bb798dd026679efd39bb1c19e87cf'),
            'assets/terminal-keycaps-mobile.webp': (5722, '41fb7c25f75f09c27b77304756eaf3da7e65b43fb182e5bd85e67de5e2177877'),
            'assets/terminal-wide.webp': (108492, '7207658c2b1f86f8bb587d155ce6a0f8dd7dbfcd165a22230ed4e755f842427a'),
          }
          def download(path):
              size, sha = files[path]
              url = 'https://samistudio.vercel.app/' + ('' if path == 'index.html' else path)
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(url, timeout=30) as response:
                          data=response.read(size+1)
                          assert response.status == 200, path
                      assert len(data) == size, 'Unexpected file size: '+path
                      assert hashlib.sha256(data).hexdigest() == sha, 'Snapshot changed: '+path
                      return path, data
                  except Exception:
                      if attempt == 2: raise
                      time.sleep(2)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              recovered=dict(pool.map(download, files))
          # Do not replace anything until every file has passed its recorded checksum.
          for path, data in recovered.items():
              target=pathlib.Path(path); target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
              print('VERIFIED', path, len(data), hashlib.sha256(data).hexdigest())
          pathlib.Path('scripts/build-studio.mjs').write_text('''import { cp, mkdir, readFile, rm, stat } from 'node:fs/promises';
          import { dirname, join, resolve } from 'node:path';
          import { fileURLToPath } from 'node:url';

          // Explicitly publish the current homepage only, never repository or Doodle sources.
          export const studioFiles = [
            'index.html', 'favicon.svg', 'assets/studio.css', 'assets/studio.js',
            'assets/key-spring.mjs', 'assets/terminal-housing.webp',
            'assets/terminal-housing-mobile.webp', 'assets/terminal-keycaps.webp',
            'assets/terminal-keycaps-mobile.webp', 'assets/terminal-wide.webp',
          ];

          export async function buildStudio(root = fileURLToPath(new URL('../', import.meta.url))) {
            root = resolve(root);
            for (const path of studioFiles) {
              const source = join(root, path);
              if (!(await stat(source)).isFile() || (await readFile(source)).length === 0) {
                throw new Error(`Missing or empty studio asset: ${path}`);
              }
            }
            const output = join(root, 'dist');
            await rm(output, { recursive: true, force: true });
            for (const path of studioFiles) {
              const target = join(output, path);
              await mkdir(dirname(target), { recursive: true });
              await cp(join(root, path), target);
            }
            return output;
          }

          if (process.argv[1] && resolve(process.argv[1]) === fileURLToPath(import.meta.url)) {
            try {
              const output = await buildStudio();
              console.log(`Built ${studioFiles.length} studio files in ${output}`);
            } catch (error) {
              console.error(error.message);
              process.exitCode = 1;
            }
          }
          ''')
          config={
              '$schema':'https://openapi.vercel.sh/vercel.json',
              'framework':None,
              'installCommand':'',
              'buildCommand':'node --test tests/studio.test.mjs && node scripts/build-studio.mjs',
              'outputDirectory':'dist',
          }
          pathlib.Path('vercel.json').write_text(json.dumps(config,indent=2)+'\n')
          manifest_path=pathlib.Path('site.webmanifest')
          manifest=json.loads(manifest_path.read_text())
          manifest.update(description='Sami Studio designs and builds websites and digital products from first idea to final interaction.',theme_color='#ad9ba2',background_color='#ad9ba2')
          manifest_path.write_text(json.dumps(manifest,indent=2)+'\n')
          ignore_path=pathlib.Path('.gitignore')
          ignore=ignore_path.read_text()
          if '.vercel/' not in ignore.splitlines():
              ignore_path.write_text(ignore.rstrip()+'\n\n# Local Vercel project link and credentials\n.vercel/\n')
          pathlib.Path('README.md').write_text('''# Sami Studio

          Personal website for Sami, product designer and builder. The homepage is the interactive terminal design: **From idea to everyday.**

          ## Website files

          - `index.html`: homepage markup, content and metadata.
          - `assets/studio.css`: desktop and mobile layouts.
          - `assets/studio.js`: terminal screens, keys, sound and entrance behavior.
          - `assets/key-spring.mjs`: key motion.
          - `assets/terminal-*.webp`: the five desktop/mobile artwork files.
          - `favicon.svg`: website icon.

          These ten runtime files were recovered byte-for-byte from the working production deployment on 16 September 2026. Edit them here for subsequent changes; the deployment is no longer the only copy of the current homepage. No framework or package installation is required for the homepage.

          ## Local preview and checks

          From the repository root, with Node.js 20 or newer:

          ```bash
          node --test tests/studio.test.mjs
          node scripts/build-studio.mjs
          python3 -m http.server 8080 --directory dist
          ```

          Open `http://localhost:8080`. The build copies only the ten current homepage files into `dist/`; it does not publish repository documentation, credentials, tests or other applications. When adding a runtime asset, update the allowlist in `scripts/build-studio.mjs` and its tests.

          ## Vercel

          Connect the **samistudio** project to this repository's `main` branch with root directory `./`. The checked-in `vercel.json` sets the build command and `dist` output directory, overriding old dashboard build/output settings. The build runs the asset tests before packaging the website. DNS and the `www` redirect remain dashboard configuration; this repository does not change them.

          If the Git integration was disconnected during migration, reconnect it only after this update is merged, then deploy the latest `main` commit. Do not reuse the separately downloaded migration folder for future edits or deployments.

          ## Other projects

          `doodle/` is a separate application and retains its own source, dependencies and deployment. Its current branch was not changed by the homepage sync.

          `11112024.html`, the `assets/11112024-*` bundles and the associated audio belong to a separate gallery, not the homepage. They remain in Git unchanged and are intentionally excluded from the homepage's `dist` output, matching the current production site. The existing icon-generation script and icon files are also retained.

          Previous homepage versions remain recoverable in normal Git history, but are not used by the current homepage or production build.
          ''')
          PY
      - name: Test the recovered website and build
        run: |
          node --test tests/studio.test.mjs
          node --input-type=module --check < assets/studio.js
          node --check assets/key-spring.mjs
          node scripts/build-studio.mjs
          git diff --exit-code -- doodle docs 11112024.html 'assets/11112024-*' public song.mp3 scripts/generate_favicon.py
          git diff --check
      - name: Check desktop and mobile terminal interactions
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/studio-browser" --no-save --ignore-scripts --no-audit --no-fund playwright@1.62.1
          cat > "$RUNNER_TEMP/studio-browser/smoke.cjs" <<'JS'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ channel: 'chrome', headless: true });
            try {
              for (const viewport of [{width:1440,height:900},{width:390,height:844}]) {
                const page=await browser.newPage({viewport,reducedMotion:'reduce'});
                const errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                page.on('response',r=>{if(r.url().startsWith('http://127.0.0.1:8080') && r.status()>=400) errors.push(r.status()+' '+r.url());});
                const response=await page.goto('http://127.0.0.1:8080/',{waitUntil:'domcontentloaded'});
                assert.equal(response.status(),200);
                await page.waitForFunction(()=>!document.documentElement.classList.contains('is-loading'),{},{timeout:20000});
                assert.equal(await page.title(),'Sami Studio | From idea to everyday');
                for (const [view,title] of [['approach','Approach'],['contact','Contact'],['about','About']]) {
                  await page.locator(`button[data-view="${view}"]`).click();
                  await page.waitForFunction(({title})=>document.querySelector('#display-title').textContent===title,{title});
                  assert.equal(await page.locator(`button[data-view="${view}"]`).getAttribute('aria-pressed'),'true');
                  assert.equal(await page.locator(`.screen[data-screen="${view}"]`).isVisible(),true);
                }
                const contact=page.locator('button[data-view="contact"]');
                await contact.focus(); await contact.press('Enter');
                await page.waitForFunction(()=>document.querySelector('#display-title').textContent==='Contact');
                assert.equal(await page.locator('.screen-contact a[href="mailto:hello@samistudio.nl"]').isVisible(),true);
                assert.equal(await page.locator('.scene-photo').evaluate(img=>img.complete && img.naturalWidth>0),true);
                assert.deepEqual(errors,[]);
                console.log(`PASS ${viewport.width}x${viewport.height}: assets, initial load, all three keys, keyboard and contact link`);
                await page.close();
              }
            } finally { await browser.close(); }
          })().catch(error=>{ console.error(error); process.exitCode=1; });
          JS
          python3 -m http.server 8080 --directory dist > "$RUNNER_TEMP/studio-http.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node "$RUNNER_TEMP/studio-browser/smoke.cjs"
      - name: Commit only the verified homepage update to the isolated branch
        run: |
          git add index.html favicon.svg assets/studio.css assets/studio.js assets/key-spring.mjs assets/terminal-*.webp scripts/build-studio.mjs vercel.json README.md site.webmanifest .gitignore
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: replace legacy homepage with verified interactive studio'
          git push origin HEAD:chore/sync-live-studio-20260916
          git rev-parse HEAD
