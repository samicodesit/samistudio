<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1024, initial-scale=1">
  <title>Doodle feature graphic</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1024px; height: 500px; margin: 0; overflow: hidden; }
    body {
      position: relative;
      background: #eef1ea;
      color: #20231f;
      font-family: Arial, Helvetica, sans-serif;
    }
    .copy {
      position: absolute;
      z-index: 2;
      top: 76px;
      left: 74px;
      width: 474px;
    }
    .wordmark {
      margin: 0 0 56px;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1.5px;
    }
    .wordmark span { color: #195c47; }
    h1 {
      max-width: 440px;
      margin: 0;
      font-size: 58px;
      line-height: .98;
      letter-spacing: -3.2px;
    }
    .disclosure {
      margin: 35px 0 0;
      color: #687068;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .2px;
    }
    .examples { position: absolute; inset: 0; }
    .note {
      position: absolute;
      width: 260px;
      height: 260px;
      padding: 9px;
      background: #fcfcf8;
      border: 1px solid rgba(32, 35, 31, .13);
      border-radius: 10px 8px 12px 7px;
      box-shadow: 13px 16px 0 rgba(25, 92, 71, .09);
    }
    .note img {
      display: block;
      width: 240px;
      height: 240px;
      object-fit: contain;
    }
    .note-one { top: 47px; right: 214px; transform: rotate(-4deg); }
    .note-two { right: 49px; bottom: 36px; transform: rotate(5deg); }
    .scribble {
      position: absolute;
      right: 465px;
      bottom: 72px;
      width: 74px;
      height: 32px;
      border-bottom: 4px solid #195c47;
      border-radius: 50%;
      transform: rotate(-8deg);
      opacity: .8;
    }
  </style>
</head>
<body>
  <main aria-label="Doodle Google Play feature graphic">
    <section class="copy">
      <p class="wordmark">Doodle<span>.</span></p>
      <h1>Little drawings.<br>Kind moments.</h1>
      <p class="disclosure">AI-generated examples</p>
    </section>
    <section class="examples" aria-label="Doodle examples">
      <div class="note note-one"><img src="../public/ideas/birthday-dog.webp" alt="Birthday dog doodle"></div>
      <div class="note note-two"><img src="../public/ideas/lunch-high-five.webp" alt="Lunchbox high-five doodle"></div>
      <div class="scribble" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>
